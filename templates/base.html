<!DOCTYPE html>

<head>
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pVU6xJGvL4Nz5Ux4jRBk8T9Y5yI71EwZpNE7vY8zSFLztJ9+WZqXl8xqE7dNpFPbNzDmdaMczw+M0Yk0T5d2cw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>

<header class="main-header py-3 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      {% block header %}{% endblock %}
    </div>

    <div class="d-flex align-items-center gap-3">
      <div class="user-info text-end">
        {% if session.get('username') %}
          <div class="small">Вы вошли как<br><strong>{{ session['username'] }}</strong></div>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-primary btn-sm d-flex align-items-center">
            <i class="fa-solid fa-right-from-bracket me-2"></i> Выйти
          </a>
        {% else %}
          <div class="small">Вы не вошли</div>
          <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm d-flex align-items-center">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Войти
          </a>
        {% endif %}
      </div>

      <button id="themeToggle" class="btn btn-primary btn-sm rounded-0 d-flex align-items-center" title="Переключить тему">
        <i class="fa-solid fa-moon me-2"></i> <span class="small">Переключить тему оформления</span>
      </button>
    </div>
  </div>
</header>


<section class="content">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</section>


<script>
  const toggle = document.getElementById('themeToggle');
  const body = document.body;

  if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-theme');
  }

  toggle.addEventListener('click', () => {
    body.classList.toggle('dark-theme');
    const isDark = body.classList.contains('dark-theme');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
</script>
