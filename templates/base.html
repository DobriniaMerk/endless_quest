<!DOCTYPE html>
<title>{% block title %}{% endblock %}</title>
<link rel=stylesheet href="{{ url_for('static', filename='style.css') }}">


<div class="nav">
  <nav>
      {% block header %}{% endblock %}
      <div class="right-controls">
        <div class="user-info">
          {% if session.get('username') %}
              <div>Вы вошли как: <strong>{{ session['username'] }}</strong></div>
              <a class="logout-button" href="{{ url_for('auth.logout') }}">Выйти</a>
          {% else %}
              <div>Вы не вошли</div>
              <a class="logout-button" href="{{ url_for('auth.login') }}">Войти</a>
          {% endif %}
        </div>
        <button id="themeToggle" title="Переключить тему">Тёмная тема</button>
      </div>
  </nav>
</div>

<section class="content">
  {% block content %}{% endblock %}
</section>


<script>
  const toggle = document.getElementById('themeToggle');
  const body = document.body;

  function updateButtonText() {
    if (body.classList.contains('dark-theme')) {
      toggle.textContent = 'Светлая тема';
    } else {
      toggle.textContent = 'Тёмная тема';
    }
  }

  if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-theme');
  }
  updateButtonText();

  toggle.addEventListener('click', () => {
    body.classList.toggle('dark-theme');
    const isDark = body.classList.contains('dark-theme');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateButtonText();
  });
</script>
