<!DOCTYPE html>
<head>
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pVU6xJGvL4Nz5Ux4jRBk8T9Y5yI71EwZpNE7vY8zSFLztJ9+WZqXl8xqE7dNpFPbNzDmdaMczw+M0Yk0T5d2cw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>


<div class="nav">
  <nav class="d-flex align-items-center justify-content-between px-3 py-2">
    {% block header %}{% endblock %}
    
    <div class="d-flex align-items-center gap-3">
      <div class="user-info">
        {% if session.get('username') %}
          <div>Вы вошли как: <strong>{{ session['username'] }}</strong></div>
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('auth.logout') }}">Выйти</a>
        {% else %}
          <div>Вы не вошли</div>
          <a class="btn btn-outline-primary btn-sm" href="{{ url_for('auth.login') }}">Войти</a>
        {% endif %}
      </div>
      <n id="themeToggle" class="btn btn-sm btn-primary" title="Переключить тему">Тёмная тема</button>
    </div>
  </nav>
</div>


<section class="content">
  {% block content %}{% endblock %}
</section>


<script>
  const toggle = document.getElementById('themeToggle');
  const body = document.body;

  function updateButtonText() {
    if (body.classList.contains('dark-theme')) {
      toggle.textContent = 'Светлая тема';
    } else {
      toggle.textContent = 'Тёмная тема';
    }
  }

  if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-theme');
  }
  updateButtonText();

  toggle.addEventListener('click', () => {
    body.classList.toggle('dark-theme');
    const isDark = body.classList.contains('dark-theme');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateButtonText();
  });
</script>
