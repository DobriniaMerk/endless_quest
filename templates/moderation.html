<h1>Модерация правок</h1>
<ul>
  {% for i, version in enumerate(version) %}
  <li>
    <h2>{{ version[1] }} {% if can_rever %} <a href="{{ url_for('moderation.history', lang=lang, ind=id, _method='POST', revision=i) }}">Вернуться к этой версии</a> {% endif %}</h2>
    <div>
      {{ version[0] }}
    </div>
  </li>
  {% endfor %}
</ul>
